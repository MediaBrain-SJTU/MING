name: CI Pipeline

on:
  push:
    branches: [main, master, dev]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  PYTHON_VERSION: '3.10'

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff black isort mypy

      - name: Run Ruff linter
        run: ruff check ming/ --output-format=github

      - name: Check code formatting with Black
        run: black --check ming/

      - name: Check import sorting with isort
        run: isort --check-only --diff ming/

      - name: Run type checking with mypy
        run: mypy ming/ --ignore-missing-imports --no-error-summary || true
        continue-on-error: true

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio
          pip install -e . || pip install -r requirements.txt

      - name: Create tests directory if not exists
        run: mkdir -p tests

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=ming --cov-report=xml --cov-report=html \
            --junitxml=test-results.xml || echo "No tests found yet"
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results.xml
            htmlcov/
            coverage.xml

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package with twine
        run: twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/

  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install safety
        run: pip install safety

      - name: Run security check
        run: safety check -r requirements.txt || true
        continue-on-error: true

  train-check:
    name: Training Module Check
    runs-on: ubuntu-latest
    needs: lint
    if: contains(github.event.head_commit.modified, 'ming/train/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install jsonschema pyyaml
          pip install -e .[train] || pip install -r requirements.txt

      - name: Validate DeepSpeed configs
        run: |
          python -c "
          import json
          import yaml
          from pathlib import Path
          import jsonschema

          schemas = {
              'zero2': {
                  'type': 'object',
                  'properties': {
                      'fp16': {'type': 'object'},
                      'bf16': {'type': 'object'},
                      'zero_optimization': {'type': 'object'}
                  }
              }
          }

          for config_file in Path('scripts').glob('*.json'):
              print(f'Validating {config_file}')
              with open(config_file) as f:
                  config = json.load(f)
              assert 'zero_optimization' in config or 'fp16' in config or 'bf16' in config
              print(f'{config_file} is valid')
          "

      - name: Check training script imports
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          try:
              from ming.train import train
              print('Training module imports OK')
          except ImportError as e:
              print(f'Import warning: {e}')
          " || true

  eval-check:
    name: Evaluation Module Check
    runs-on: ubuntu-latest
    needs: lint
    if: contains(github.event.head_commit.modified, 'ming/eval/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -e . || pip install -r requirements.txt

      - name: Validate evaluation datasets
        run: |
          python -c "
          import jsonlines
          from pathlib import Path

          dataset_dir = Path('ming/eval/datasets')
          if dataset_dir.exists():
              for data_file in dataset_dir.glob('*.jsonl'):
                  print(f'Checking {data_file}')
                  count = 0
                  with jsonlines.open(data_file) as reader:
                      for obj in reader:
                          count += 1
                          if count >= 5:
                              break
                  print(f'{data_file} contains valid JSONL')
          "

      - name: Test evaluation metrics
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          try:
              from ming.eval.cblue.evaluate import calc_scores
              print('Evaluation metrics module OK')
          except ImportError as e:
              print(f'Import warning: {e}')
          " || true

  serve-check:
    name: Service Module Check
    runs-on: ubuntu-latest
    needs: lint
    if: contains(github.event.head_commit.modified, 'ming/serve/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install -e . || pip install -r requirements.txt
          pip install httpx pytest-asyncio

      - name: Test FastAPI import
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          try:
              from ming.serve.inference import generate_stream
              print('Serve module imports OK')
          except ImportError as e:
              print(f'Import warning: {e}')
          " || true

      - name: Test Gradio import
        run: |
          python -c "
          import gradio as gr
          print(f'Gradio version: {gr.__version__}')
          "

      - name: Test FastAPI startup
        run: |
          python -c "
          from fastapi import FastAPI
          app = FastAPI()
          
          @app.get('/health')
          def health():
              return {'status': 'ok'}
          
          print('FastAPI app created successfully')
          "
