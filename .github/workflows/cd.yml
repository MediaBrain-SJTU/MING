name: CD Pipeline

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

env:
  PYTHON_VERSION: '3.10'

jobs:
  version-validation:
    name: Version Validation
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      is_release: ${{ steps.check_tag.outputs.is_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install semantic version checker
        run: |
          pip install semantic-version toml

      - name: Get version from pyproject.toml
        id: get_version
        run: |
          python -c "
          import toml
          config = toml.load('pyproject.toml')
          print(f'version={config[\"project\"][\"version\"]}')
          " >> $GITHUB_OUTPUT

      - name: Validate semantic version
        run: |
          python -c "
          import semantic_version
          version = '${{ steps.get_version.outputs.version }}'
          if semantic_version.validate(version):
              print(f'Valid semantic version: {version}')
          else:
              raise ValueError(f'Invalid semantic version: {version}')
          "

      - name: Check if tag push
        id: check_tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_VERSION=${GITHUB_REF#refs/tags/v}
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "tag_version=$TAG_VERSION" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify tag matches pyproject.toml version
        if: steps.check_tag.outputs.is_release == 'true'
        run: |
          if [ "${{ steps.check_tag.outputs.tag_version }}" != "${{ steps.get_version.outputs.version }}" ]; then
            echo "Tag version (${{ steps.check_tag.outputs.tag_version }}) does not match pyproject.toml version (${{ steps.get_version.outputs.version }})"
            exit 1
          fi

  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    needs: version-validation
    if: needs.version-validation.outputs.is_release == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: |
          python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          twine upload dist/* --non-interactive

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-packages
          path: dist/

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [version-validation, build-and-publish]
    if: needs.version-validation.outputs.is_release == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-packages
          path: dist/

      - name: Generate Release Notes
        id: release_notes
        run: |
          cat > RELEASE_NOTES.md << 'EOF'
          ## Release v${{ needs.version-validation.outputs.version }}

          ### What's Changed
          * Auto-generated release for version ${{ needs.version-validation.outputs.version }}

          ### Installation
          ```bash
          pip install ming==${{ needs.version-validation.outputs.version }}
          ```
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.version-validation.outputs.version }}
          name: Release v${{ needs.version-validation.outputs.version }}
          body_path: RELEASE_NOTES.md
          files: dist/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [version-validation, build-and-publish, create-release]
    if: always()
    steps:
      - name: Send notification
        run: |
          STATUS="success"
          if [ "${{ needs.build-and-publish.result }}" != "success" ] && [ "${{ needs.version-validation.outputs.is_release }}" == "true" ]; then
            STATUS="failure"
          fi
          echo "Deployment $STATUS for version ${{ needs.version-validation.outputs.version }}"
