# MING-7B 专科训练配置文件
# 配置版本: 1.0
# 创建时间: 2024-01-01

# =============================================================================
# 基础训练参数
# =============================================================================
output_dir: "./specialty_output"
num_train_epochs: 3
per_device_train_batch_size: 8
per_device_eval_batch_size: 16
gradient_accumulation_steps: 1
learning_rate: 2.0e-5
weight_decay: 0.01
max_grad_norm: 1.0

# =============================================================================
# 模型和分词器配置
# =============================================================================
model_name_or_path: ""
tokenizer_name_or_path: null
prompt_type: "qwen"

# =============================================================================
# 数据配置
# =============================================================================
train_data_path: "ming/eval/datasets/mmedbench-02-chinese-tiny.jsonl"
val_data_path: null

# =============================================================================
# 显存优化配置
# =============================================================================
fp16: true
bf16: false
gradient_checkpointing: true
optim: "adamw_torch"
max_memory_usage_gb: 22.0

# =============================================================================
# 收敛优化配置
# =============================================================================
lr_scheduler_type: "cosine_with_warmup"
warmup_ratio: 0.1
warmup_steps: 0
max_steps: -1
ema: false
ema_decay: 0.999
early_stopping: true
early_stopping_patience: 3

# =============================================================================
# 专科训练特定配置
# =============================================================================
specialty_type: "general"
specialty_weights:
  cardiovascular: 1.2
  neurology: 1.2
  respiratory: 1.0
  gastroenterology: 1.0
  endocrinology: 1.0
difficulty_weight: 0.2
specialty_focus: true

# =============================================================================
# 日志和评估配置
# =============================================================================
logging_steps: 10
eval_steps: 100
save_steps: 500
save_total_limit: 3
evaluation_strategy: "steps"

# =============================================================================
# LoRA 配置
# =============================================================================
lora:
  r: 8
  alpha: 32
  dropout: 0.1
  target_modules:
    - "q_proj"
    - "v_proj"

# =============================================================================
# 其他配置
# =============================================================================
seed: 42
dataloader_num_workers: 4
local_rank: -1
deepspeed: null
