# 优化训练Pipeline配置

# 模型配置
model:
  model_name_or_path: "Qwen/Qwen1.5-7B-Chat"
  trust_remote_code: true

# 数据配置
data:
  train_data_path: "ming/eval/datasets/train.jsonl"
  eval_data_path: "ming/eval/datasets/eval.jsonl"
  max_seq_length: 512
  prompt_type: "qwen"

# LoRA配置
lora:
  use_lora: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  bias: "none"

# 量化配置
quantization:
  load_in_4bit: true
  load_in_8bit: false
  bnb_4bit_compute_dtype: "float16"
  bnb_4bit_use_double_quant: true
  bnb_4bit_quant_type: "nf4"

# 训练配置
training:
  num_train_epochs: 3.0
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 8
  learning_rate: 0.0002
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  max_grad_norm: 0.3

# 内存优化配置
memory_optimization:
  gradient_checkpointing: true
  max_memory_mb: 22000  # 限制在22GB以内
  optim: "paged_adamw_8bit"
  fp16: true

# 保存配置
checkpoint:
  output_dir: "./output"
  save_steps: 500
  eval_steps: 500
  logging_steps: 10
  save_total_limit: 3
  load_best_model_at_end: true

# 早停配置
early_stopping:
  patience: 3
  threshold: 0.001

# 专科配置
specialty:
  enabled: true
  target_specialties:
    - 心血管
    - 神经内科
    - 呼吸
    - 消化
    - 内分泌
  feature_engineering: true

# 性能监控
monitoring:
  log_memory_usage: true
  log_gpu_stats: true
  profile_performance: false
