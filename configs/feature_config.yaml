# MING-7B 特征工程配置文件
# 配置版本: 1.0
# 创建时间: 2024-01-01

# =============================================================================
# 基本设置
# =============================================================================
device: "cuda"
batch_size: 32
num_workers: 4

# =============================================================================
# 实体识别配置
# =============================================================================
entity_recognition:
  enabled: true
  max_entity_length: 50
  confidence_threshold: 0.5
  merge_overlapping: true
  remove_substrings: true

# =============================================================================
# 实体类型配置
# =============================================================================
entity_types:
  - "疾病"
  - "症状"
  - "药物"
  - "检查"
  - "治疗"
  - "身体部位"
  - "医疗器械"
  - "细菌"
  - "病毒"
  - "专科"

# =============================================================================
# 特征提取配置
# =============================================================================
feature_extraction:
  statistical: true
  entity: true
  semantic: true
  specialty: true
  embedding_dim: 768
  max_features: 1000

# =============================================================================
# 特征选择配置
# =============================================================================
feature_selection:
  enabled: true
  method: "mutual_info"  # 可选: mutual_info, chi2, f_classif
  n_features: 100
  threshold: 0.01
  scale_features: true
  normalize: true

# =============================================================================
# 专科特征权重
# =============================================================================
specialty_weights:
  cardiovascular: 1.2
  neurology: 1.2
  respiratory: 1.0
  gastroenterology: 1.0
  endocrinology: 1.0
  nephrology: 0.8
  hematology: 0.8
  rheumatology: 0.8
  infectious: 0.8

# =============================================================================
# 性能约束
# =============================================================================
performance:
  max_extraction_time_ms: 50
  min_coverage: 0.95
  target_f1: 0.92
  entity_density_min: 0.01
  entity_density_max: 0.3

# =============================================================================
# 输出配置
# =============================================================================
output:
  save_features: true
  save_entities: true
  save_embeddings: false
  output_dir: "./feature_output"
  format: "json"
  compression: null
