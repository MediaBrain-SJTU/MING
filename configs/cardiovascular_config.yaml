model:
  name_or_path: "Qwen/Qwen-7B"
  max_length: 512
  max_new_tokens: 256

training:
  output_dir: "outputs/cardiovascular_finetuned"
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  num_epochs: 3
  logging_steps: 10
  save_steps: 500
  eval_steps: 500
  save_total_limit: 3
  
  fp16: false
  bf16: true
  gradient_checkpointing: true

lora:
  enable: true
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "v_proj"
    - "k_proj"
    - "o_proj"

molora:
  num_experts: 4
  num_experts_per_token: 2
  expert_selection: "top_k"
  share_expert: false
  router_loss_coeff: 0.01

memory:
  max_memory_gb: 22.0
  optimize_memory: true
  use_flash_attention: true

specialties:
  - "cardiovascular"

data:
  data_dir: "ming/eval/datasets"
  train_val_split: 0.8
  balance_strategy: "oversample"
  augment_ratio: 0.2

feature_engineering:
  entity_recognition:
    specialty: "cardiovascular"
    enable_lab_value_extraction: true
    target_f1: 0.92
    max_processing_time_ms: 50
    min_coverage_rate: 0.95
  
  feature_extraction:
    extract_metadata: true
    normalize_features: true
    feature_dim: 128

evaluation:
  metrics:
    - "exact_match"
    - "f1"
    - "rouge"
    - "medical_accuracy"
  
  report:
    output_dir: "reports/cardiovascular"
    include_visualization_data: true
    max_generation_time_seconds: 300

constraints:
  max_training_memory_gb: 22.0
  max_inference_memory_gb: 16.0
  max_pipeline_hours: 72
  target_em_improvement_percent: 15
  target_convergence_improvement_percent: 20

logging:
  level: "INFO"
  report_to:
    - "none"
  run_name: "cardiovascular_specialty_train"
