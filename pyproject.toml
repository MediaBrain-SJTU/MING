[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ming"
version = "1.1.3"
description = "Medical GPT"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "torch==2.0.1", "torchvision==0.15.2",
    "accelerate==0.27.2", "peft==0.4.0", "bitsandbytes==0.41.0",
    "pydantic<2,>=1", "markdown2[all]", "numpy", "scikit-learn==1.2.2",
    "gradio==3.35.2", "gradio_client==0.2.9",
    "requests", "httpx==0.24.0", "uvicorn", "fastapi",
    "einops==0.6.1", "einops-exts==0.0.4", "timm==0.6.13", "transformers>=4.37.0", "jsonlines"
]

[project.optional-dependencies]
train = ["deepspeed>=0.9.5", "ninja", "wandb"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "pytest-asyncio>=0.21", "ruff>=0.1.0", "black>=23.0", "isort>=5.12", "mypy>=1.0"]

[project.scripts]
ming-cli = "ming.serve.cli:main"

[tool.setuptools.packages.find]
exclude = ["assets*", "benchmark*", "docs", "dist*", "playground*", "scripts*", "tests*"]

[tool.wheel]
exclude = ["assets*", "benchmark*", "docs", "dist*", "playground*", "scripts*", "tests*"]

[tool.ruff]
target-version = "py38"
line-length = 120
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501", "B008", "C901"]
exclude = [".git", "__pycache__", "build", "dist", ".eggs", "*.egg-info", "venv", ".venv"]

[tool.ruff.isort]
known-first-party = ["ming"]

[tool.black]
line-length = 120
target-version = ["py38", "py39", "py310", "py311"]
exclude = '''
/(
    \.git
    | __pycache__
    | build
    | dist
    | \.eggs
    | .*\.egg-info
    | venv
    | \.venv
)/
'''

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["ming"]
skip = [".git", "__pycache__", "build", "dist", ".eggs", "*.egg-info", "venv", ".venv"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["build", "dist", "venv", ".venv"]

[tool.coverage.run]
source = ["ming"]
branch = true
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
