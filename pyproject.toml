[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ming"
version = "1.1.3"
description = "Medical GPT"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "torch==2.0.1", "torchvision==0.15.2",
    "accelerate==0.27.2", "peft==0.4.0", "bitsandbytes==0.41.0",
    "pydantic<2,>=1", "markdown2[all]", "numpy", "scikit-learn==1.2.2",
    "gradio==3.35.2", "gradio_client==0.2.9",
    "requests", "httpx==0.24.0", "uvicorn", "fastapi",
    "einops==0.6.1", "einops-exts==0.0.4", "timm==0.6.13", "transformers>=4.37.0", "jsonlines"
]

[project.optional-dependencies]
train = ["deepspeed>=0.9.5", "ninja", "wandb"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1",
    "tox>=4.0",
    "build>=1.0",
    "twine>=4.0",
]

[tool.setuptools.packages.find]
exclude = ["assets*", "benchmark*", "docs", "dist*", "playground*", "scripts*", "tests*"]

[tool.wheel]
exclude = ["assets*", "benchmark*", "docs", "dist*", "playground*", "scripts*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --cov=ming --cov-report=term-missing --cov-report=xml"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.black]
line-length = 120
target-version = ['py38', 'py39', 'py310']

[tool.ruff]
line-length = 120
target-version = "py38"
select = ["E", "F", "I", "B", "C4", "SIM", "UP"]
ignore = ["E501", "F401", "F403"]
exclude = [
    ".git",
    "__pycache__",
    "tests",
    "scripts",
]

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py{38,39,310}
skipsdist = true

[testenv]
deps =
    -r requirements.txt
    -e .[dev]
commands =
    pytest tests/unit -v --timeout=60
"""
